name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate SemVer tag against VERSION
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,pathlib,re
          v=pathlib.Path('VERSION').read_text().strip()
          t=os.environ['REF_NAME'] if os.environ['REF'].startswith('refs/tags/') else 'v'+v
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',t) and t[1:]==v
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('RELEASE_TAG='+t+'\n')
          PY
      - run: bash scripts/bootstrap-theos.sh
      - run: bash scripts/build.sh
      - name: Publish original plugin only (pre-release until device validation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release.py --verify
          command -v gh >/dev/null
          python3 tools/release.py --publish
