name: Build IPA
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact authorized source IPA version
        type: choice
        options: ['41.3.0', '41.2.0']
        default: '41.3.0'
      source_sha256:
        description: Independently obtained SHA256 of the source IPA
        type: string
        required: true
      acknowledge_modification_rights:
        description: I am authorized to modify this input IPA
        type: boolean
        default: false
      authorize_existing_storage_cost:
        description: Optional S3 requests/transfer/storage may cost money; I explicitly authorize use of my existing private storage
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: private-ipa
  cancel-in-progress: false
jobs:
  private-ipa:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.acknowledge_modification_rights && inputs.authorize_existing_storage_cost
    environment: private-ipa
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      PRIVATE_DIR: ${{ runner.temp }}/aweme-private-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate authorized source hash (before cloud access)
        env:
          EXPECTED_SHA256: ${{ inputs.source_sha256 }}
        run: python3 -c 'import os,re; assert re.fullmatch(r"[a-fA-F0-9]{64}",os.environ["EXPECTED_SHA256"])'
      - run: bash scripts/bootstrap-theos.sh
      - run: bash scripts/build.sh
      - name: Check installed AWS client
        run: command -v aws >/dev/null || brew install awscli
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - name: Read authorized private input; never upload to public artifacts
        env:
          SOURCE_IPA_S3_URI: ${{ secrets.SOURCE_IPA_S3_URI }}
        run: python3 tools/private_storage.py get --uri-env SOURCE_IPA_S3_URI --file "$PRIVATE_DIR/source.ipa" --authorize-existing-storage-cost
      - name: Integrate, repackage and verify unsigned complete IPA
        env:
          IPA_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.source_sha256 }}
        run: |
          python3 tools/ipa.py --ipa "$PRIVATE_DIR/source.ipa" --version "$IPA_VERSION" --dylib dist/AwemeEnhance.dylib --output "$PRIVATE_DIR/AwemeEnhance_$IPA_VERSION.ipa" --expected-sha256 "$EXPECTED_SHA256" --acknowledge-modification-rights
      - name: Deliver complete IPA, checksums and report to authorized private bucket
        env:
          OUTPUT_IPA_S3_URI: ${{ secrets.OUTPUT_IPA_S3_URI }}
          IPA_VERSION: ${{ inputs.version }}
        run: |
          python3 tools/private_storage.py put --uri-env OUTPUT_IPA_S3_URI --file "$PRIVATE_DIR/AwemeEnhance_$IPA_VERSION.ipa" --authorize-existing-storage-cost
          export OUTPUT_REPORT_S3_URI="$OUTPUT_IPA_S3_URI.report.json"
          export OUTPUT_SHA_S3_URI="$OUTPUT_IPA_S3_URI.SHA256SUMS.txt"
          python3 tools/private_storage.py put --uri-env OUTPUT_REPORT_S3_URI --file "$PRIVATE_DIR/AwemeEnhance_$IPA_VERSION.report.json" --authorize-existing-storage-cost
          python3 tools/private_storage.py put --uri-env OUTPUT_SHA_S3_URI --file "$PRIVATE_DIR/SHA256SUMS.txt" --authorize-existing-storage-cost
      - name: Delete private temporary files (success or failure)
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          p=pathlib.Path(os.environ['PRIVATE_DIR']).resolve()
          root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          assert p.is_relative_to(root) and p!=root and p.name.startswith('aweme-private-')
          if p.exists(): shutil.rmtree(p)
          PY
      # Deliberately NO upload-artifact, actions/cache or Release step in this workflow.
