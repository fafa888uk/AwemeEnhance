name: Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: '13 5 * * 1'
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'fafa888uk/AwemeEnhance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Propose pinned Theos update; never auto-merge or rewrite research decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_dependencies.py
