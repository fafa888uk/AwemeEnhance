name: Update Dependencies
on:
  workflow_dispatch:
  schedule:
    - cron: '13 5 * * 1'
permissions:
  contents: read
jobs:
  review:
    if: github.repository == 'fafa888uk/AwemeEnhance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Propose pinned Theos update; never auto-merge or rewrite research decisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_dependencies.py
